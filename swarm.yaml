version: "3.8"

services:
  app:
    image: registry.digitalocean.com/ece1779-inventory/inventory-app:v1
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgres://inventory_user@db:5432/inventory_db
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      REDIS_URL: redis://redis:6379
    secrets:
      - postgres_password
      - session_secret
    networks:
      - inventory_net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_DB: inventory_db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - /mnt/inventory_postgres_data/postgres:/var/lib/postgresql/data
    networks:
      - inventory_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.postgres == true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - inventory_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == inventory-manager

  nginx:
    image: nginx:alpine
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      - inventory_net
    deploy:
      replicas: 1

networks:
  inventory_net:
    driver: overlay

volumes:
  redis_data:

secrets:
  postgres_password:
    external: true
  session_secret:
    external: true

configs:
  nginx_config:
    external: true
